version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j-langchain
    ports:
      - "7474:7474"
      - "7687:7687"
    # ADD THIS DNS BLOCK TO GIVE THE CONTAINER INTERNET:
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=false
    volumes:
      - ./data:/data
volumes:
  data:
